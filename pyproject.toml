[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imc2mc"
dynamic = ["version"]
description = "Convert Imaging Mass Cytometry (IMC) output .txt files to OME-TIFF"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Margot Chazotte", email = "margot.chazotte@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["imaging mass cytometry", "IMC", "OME-TIFF", "MCMICRO"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "readimc>=0.7.0",
    "ome-types>=0.5.1",
    "tifffile>=2023.2.28",
    "scipy>=1.13.1",
    "numpy",
    "imageio",
    "pandas",
]

[project.scripts]
imc2mc = "imc2mc.main:cli"

[project.urls]
Homepage = "https://github.com/schapirolabor/imc2mc"

[tool.setuptools.dynamic]
version = { attr = "imc2mc._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
